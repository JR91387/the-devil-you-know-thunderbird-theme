<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
<title>The Devil You Know: A crisp light look that feels like the office mail app you already know.</title>
<style>@font-face{font-family:"Brand";src:url("fonts/Selawik-Semibold.ttf");font-weight:600;}@font-face{font-family:"Body";src:url("fonts/Selawik-Regular.ttf");font-weight:400;}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#FFFFFF"/><stop offset="0.50" stop-color="#F3F2F1"/><stop offset="1.00" stop-color="#DCE9F7"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9D5FF"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
<radialGradient id="blob" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#C4B5FD"/><stop offset="0.45" stop-color="#6D28D9"/><stop offset="1" stop-color="#1E1B4B"/></radialGradient>
<filter id="soft" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="320" fill="url(#bg)"/>
<rect x="0" y="0" width="6" height="320" fill="#0F6CBD"/><rect x="1100" y="316" width="180" height="4" fill="#0F6CBD" opacity="0.35"/>
<text x="72.0" y="160" font-family="Brand" font-weight="600" font-size="64" fill="#242424">The Devil You Know</text>

<text x="72.0" y="204" font-family="Body" font-size="24" fill="#424242">A crisp light look that feels like the office mail app you already know.</text>

</svg>
